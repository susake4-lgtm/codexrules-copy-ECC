model = "gpt-5.4"
model_reasoning_effort = "xhigh"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only evidence gathering before implementation or planning changes."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Reviewer focused on correctness, regressions, risk, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Primary-docs researcher for APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

